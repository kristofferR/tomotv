name: Private unsigned tvOS archive

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  archive:
    if: github.repository == 'kristofferR/tomotv' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/ci/tvos-private-archive-6808319a'
    runs-on: macos-26
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      CANDIDATE_SHA: e45b9f05184c6b7fb33a020c7cb1d04276988a9d
      ARTIFACT_RECIPIENT: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEafGHMwP9NUowbsjvz5a1Rb6hAyTAfGTqVaeGTUexTH
      CI: '1'
      EXPO_TV: '1'
      EXPO_NO_TELEMETRY: '1'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      FORCE_BUNDLING: '1'
    steps:
      - name: Checkout exact archive ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify candidate and toolchain
        run: |
          mkdir -p "$RUNNER_TEMP/tomo-private/evidence"
          git merge-base --is-ancestor "$CANDIDATE_SHA" HEAD
          git diff --exit-code "$CANDIDATE_SHA" HEAD -- . ':!.github/workflows/test-pr.yml'
          git rev-parse HEAD > "$RUNNER_TEMP/tomo-private/evidence/workflow-sha.txt"
          xcodebuild -version > "$RUNNER_TEMP/tomo-private/evidence/xcode.txt"
          grep -qx 'Xcode 26.6' "$RUNNER_TEMP/tomo-private/evidence/xcode.txt"
          shasum -a 256 package-lock.json > "$RUNNER_TEMP/tomo-private/evidence/npm-lock.sha256"
          jq -S '.pins' packages/tomo-engine/Package.resolved > "$RUNNER_TEMP/tomo-private/evidence/expected-pins.json"
          jq -e '.pins | length == 1 and .[0].identity == "spatialaudiobridge" and .[0].state.version == "1.6.2" and .[0].state.revision == "14275b11c510596c0f3a361e5da70cec109e99be"' packages/tomo-engine/Package.resolved

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install archive preparation tools
        run: brew install age ffmpeg

      - name: Install locked dependencies and frameworks
        run: |
          npm ci 2>&1 | tee "$RUNNER_TEMP/tomo-private/evidence/npm-ci.log"
          npm run fetch:ffmpeg 2>&1 | tee "$RUNNER_TEMP/tomo-private/evidence/ffmpeg.log"
          pod --version | tee "$RUNNER_TEMP/tomo-private/evidence/cocoapods-version.txt"
          git diff --exit-code "$CANDIDATE_SHA" -- . ':!.github/workflows/test-pr.yml'
          shasum -a 256 -c "$RUNNER_TEMP/tomo-private/evidence/npm-lock.sha256"

      - name: Check licenses and package policy
        run: |
          npm run licenses
          git diff --exit-code constants/bundled-licenses.ts
          node scripts/package-versions.mjs --check
          node scripts/package-versions.mjs --files

      - name: Verify passed suites for this exact source candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tested_workflow=4f069777777ced1d1eeb5825c24b552890ae6d26
          git diff --exit-code "$CANDIDATE_SHA" "$tested_workflow" -- . ':!.github/workflows/test-pr.yml'
          gh api repos/kristofferR/tomotv/actions/runs/38805902651 > "$RUNNER_TEMP/tomo-private/evidence/test-run.json"
          jq -e --arg head "$tested_workflow" '.head_sha == $head and .status == "completed"' "$RUNNER_TEMP/tomo-private/evidence/test-run.json"
          gh api repos/kristofferR/tomotv/actions/jobs/116666558086 > "$RUNNER_TEMP/tomo-private/evidence/test-job.json"
          jq -e '.run_id == 38805902651 and any(.steps[]; .name == "Engine and native package suites" and .conclusion == "success")' "$RUNNER_TEMP/tomo-private/evidence/test-job.json"

      - name: Assemble tvOS project through Expo and CocoaPods
        run: |
          npx --no-install expo prebuild --clean --platform ios --no-install 2>&1 | tee "$RUNNER_TEMP/tomo-private/evidence/prebuild.log"
          pod install --project-directory=ios 2>&1 | tee "$RUNNER_TEMP/tomo-private/evidence/pods.log"
          test -f ios/TomoTV.xcworkspace/contents.xcworkspacedata
          cmp native/ios/MultiAudioResourceLoader/RNVideoPlugin.swift ios/MultiAudioResourceLoader/RNVideoPlugin.swift
          cp ios/Podfile.lock "$RUNNER_TEMP/tomo-private/evidence/Podfile.lock"
          cp ios/Pods/Pods.xcodeproj/project.pbxproj "$RUNNER_TEMP/tomo-private/evidence/Pods.pbxproj"
          cp ios/TomoTV.xcodeproj/project.pbxproj "$RUNNER_TEMP/tomo-private/evidence/TomoTV.pbxproj"
          cp 'ios/Pods/Target Support Files/TomoEngine/TomoEngine.release.xcconfig' "$RUNNER_TEMP/tomo-private/evidence/TomoEngine.release.xcconfig"
          grep -Fx 'CONFIGURATION_BUILD_DIR = $(PODS_CONFIGURATION_BUILD_DIR)' "$RUNNER_TEMP/tomo-private/evidence/TomoEngine.release.xcconfig"
          mkdir -p ios/TomoTV.xcworkspace/xcshareddata/swiftpm
          cp packages/tomo-engine/Package.resolved ios/TomoTV.xcworkspace/xcshareddata/swiftpm/Package.resolved
          mkdir -p ios/Pods/Pods.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          cp packages/tomo-engine/Package.resolved ios/Pods/Pods.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          git diff --exit-code "$CANDIDATE_SHA" -- . ':!.github/workflows/test-pr.yml'
          shasum -a 256 -c "$RUNNER_TEMP/tomo-private/evidence/npm-lock.sha256"

      - name: Verify effective archive staging directory
        run: |
          xcodebuild -project ios/Pods/Pods.xcodeproj -scheme TomoEngine -configuration Release \
            -sdk appletvos -showBuildSettings -json DEPLOYMENT_LOCATION=YES \
            -derivedDataPath "$RUNNER_TEMP/tomo-pod-settings" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/tomo-source-packages" \
            -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            > "$RUNNER_TEMP/tomo-private/evidence/engine-build-settings.json"
          jq -e '[.[] | select(.target == "TomoEngine") | .buildSettings |
            select(.BUILT_PRODUCTS_DIR == .PODS_CONFIGURATION_BUILD_DIR and
                   .CONFIGURATION_BUILD_DIR == .PODS_CONFIGURATION_BUILD_DIR)] | length == 1' \
            "$RUNNER_TEMP/tomo-private/evidence/engine-build-settings.json"

      - name: Archive unsigned tvOS Release app with bundled JavaScript
        run: |
          xcodebuild archive \
            -workspace ios/TomoTV.xcworkspace -scheme TomoTV -configuration Release \
            -sdk appletvos -destination 'generic/platform=tvOS' -jobs 2 \
            -archivePath "$RUNNER_TEMP/tomo-private/TomoTV.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/tomo-derived-data" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/tomo-source-packages" \
            -resultBundlePath "$RUNNER_TEMP/tomo-private/evidence/Archive.xcresult" \
            -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= DEVELOPMENT_TEAM= \
            2>&1 | tee "$RUNNER_TEMP/tomo-private/evidence/archive.log"

      - name: Verify unsigned device app and bundled JavaScript
        run: |
          app="$RUNNER_TEMP/tomo-private/TomoTV.xcarchive/Products/Applications/TomoTV.app"
          test -s "$app/main.jsbundle"
          test -d "$app/PlugIns/TopShelf.appex"
          test ! -e "$app/embedded.mobileprovision"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleSupportedPlatforms:0' "$app/Info.plist")" = AppleTVOS
          test "$(lipo -archs "$app/TomoTV")" = arm64
          extension="$app/PlugIns/TopShelf.appex"
          test -s "$extension/TopShelf"
          test "$(lipo -archs "$extension/TopShelf")" = arm64
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleSupportedPlatforms:0' "$extension/Info.plist")" = AppleTVOS
          for bundle in "$app" "$extension"; do
            test ! -e "$bundle/embedded.mobileprovision"
            test ! -d "$bundle/_CodeSignature"
            if codesign -d "$bundle" >> "$RUNNER_TEMP/tomo-private/evidence/signature.txt" 2>&1; then
              echo "Unexpected signed bundle: $bundle"
              exit 1
            fi
          done
          archive="$RUNNER_TEMP/tomo-private/TomoTV.xcarchive"
          find "$archive/Signatures" -name 'SpatialAudioCore.xcframework-tvos.signature' > "$RUNNER_TEMP/tomo-private/evidence/core-signatures.txt"
          test "$(wc -l < "$RUNNER_TEMP/tomo-private/evidence/core-signatures.txt" | tr -d ' ')" = 1
          test -s "$archive/Signatures/SpatialAudioCore.xcframework-tvos.signature"
          test "$(grep -c '^SignatureCollection .*SpatialAudioCore.xcframework-tvos.signature$' "$RUNNER_TEMP/tomo-private/evidence/archive.log")" = 1
          file "$app/main.jsbundle" "$app/TomoTV" > "$RUNNER_TEMP/tomo-private/evidence/app-files.txt"
          jq -n --arg candidate "$CANDIDATE_SHA" --arg workflow "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" \
            '{candidate:$candidate,workflow:$workflow,run:$run,platform:"tvOS",architecture:"arm64",configuration:"Release",unsigned:true,bundledJavaScript:true}' \
            > "$RUNNER_TEMP/tomo-private/evidence/verified-app.json"

      - name: Verify source and dependency locks stayed fixed
        run: |
          git diff --exit-code "$CANDIDATE_SHA" -- . ':!.github/workflows/test-pr.yml'
          shasum -a 256 -c "$RUNNER_TEMP/tomo-private/evidence/npm-lock.sha256"
          cmp ios/Podfile.lock "$RUNNER_TEMP/tomo-private/evidence/Podfile.lock"
          for lock in packages/tomo-engine/Package.resolved native/ios/Package.resolved ios/TomoTV.xcworkspace/xcshareddata/swiftpm/Package.resolved ios/Pods/Pods.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved; do
            diff -u "$RUNNER_TEMP/tomo-private/evidence/expected-pins.json" <(jq -S '.pins' "$lock")
          done

      - name: Encrypt archive and evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/tomo-private/evidence" "$RUNNER_TEMP/tomo-encrypted"
          for package in packages/tomo-engine native/ios; do
            if [ -f "$package/.build/test.log" ]; then
              cp "$package/.build/test.log" "$RUNNER_TEMP/tomo-private/evidence/$(basename "$package")-test.log"
            fi
          done
          entries=(evidence)
          if [ -d "$RUNNER_TEMP/tomo-private/TomoTV.xcarchive" ]; then entries+=(TomoTV.xcarchive); fi
          COPYFILE_DISABLE=1 tar -czf "$RUNNER_TEMP/tomo-private.tar.gz" -C "$RUNNER_TEMP/tomo-private" "${entries[@]}"
          artifact="tomo-tvos-${CANDIDATE_SHA:0:8}.tar.gz.age"
          age -r "$ARTIFACT_RECIPIENT" -o "$RUNNER_TEMP/tomo-encrypted/$artifact" "$RUNNER_TEMP/tomo-private.tar.gz"
          cd "$RUNNER_TEMP/tomo-encrypted"
          shasum -a 256 "$artifact" > SHA256SUMS

      - name: Preserve encrypted private artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tomo-tvos-${{ env.CANDIDATE_SHA }}-private-encrypted
          path: ${{ runner.temp }}/tomo-encrypted/
          if-no-files-found: error
          retention-days: 90
