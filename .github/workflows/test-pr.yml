name: SpatialAudioBridge 2.0 validation

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CANDIDATE_SHA: 93e3bf24eca6acd5e24e68f02f4a65e1476e442b

jobs:
  test:
    if: github.repository == 'kristofferR/tomotv' && github.ref == 'refs/heads/ci/sab-2.0-validation'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source candidate
        run: |
          git merge-base --is-ancestor "$CANDIDATE_SHA" HEAD
          git diff --exit-code "$CANDIDATE_SHA" HEAD -- . ':!.github/workflows/test-pr.yml'

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Tests with the coverage floor
        run: npm run test:coverage

      - name: Lint
        run: |
          npm run lint
          git diff --exit-code

      - name: Licenses are current
        run: npm run licenses && git diff --exit-code constants/bundled-licenses.ts

      - name: Package versions and tarballs
        run: node scripts/package-versions.mjs --check && node scripts/package-versions.mjs --files

      - name: Playback manifest and baselines agree
        run: npm run test:playback:manifest

      - name: Screenshot slots hold their own captions
        run: npm run test:shots

  engine:
    if: github.repository == 'kristofferR/tomotv' && github.ref == 'refs/heads/ci/sab-2.0-validation'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Synthetic-fixture encoder
        run: brew install ffmpeg

      - name: Engine and native package suites
        run: npm run test:engine

      - name: The pins resolved to SpatialAudioBridge 2.0.0 and stayed put
        run: |
          for lock in packages/tomo-engine/Package.resolved native/ios/Package.resolved; do
            jq -e '.pins | length == 1 and .[0].state.version == "2.0.0" and .[0].state.revision == "61ed9b602b0736954d34288aa635731a67217a59"' "$lock"
          done
          git diff --exit-code -- packages/tomo-engine/Package.resolved native/ios/Package.resolved

      - name: The spatial cases ran
        run: |
          for name in testOnlyContentRefusalsAreRemembered testTheProbeRefusesATrackThatNeverRendersForTheProcess testPlainTrueHDStaysOnTheTranscoder testDTSCoreStaysOnTheTranscoder testEachFailedSessionLeavesItsReplacementOnFLAC; do
            grep -E "Test Case .*SpatialAudioTests[ .]$name.*passed" packages/tomo-engine/.build/test.log
          done
          grep -E "Test Case .*SpatialAudioTests" packages/tomo-engine/.build/test.log

      - name: Compile engine for Apple TV
        run: >-
          swift build --package-path packages/tomo-engine --target TomoEngine
          --scratch-path "$RUNNER_TEMP/tomo-tvos"
          --triple arm64-apple-tvos16.4 --sdk "$(xcrun --sdk appletvos --show-sdk-path)"

  archive:
    if: github.repository == 'kristofferR/tomotv' && github.ref == 'refs/heads/ci/sab-2.0-validation'
    runs-on: macos-26
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      ARTIFACT_RECIPIENT: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEafGHMwP9NUowbsjvz5a1Rb6hAyTAfGTqVaeGTUexTH
      CI: "1"
      EXPO_TV: "1"
      EXPO_NO_TELEMETRY: "1"
      HOMEBREW_NO_AUTO_UPDATE: "1"
      FORCE_BUNDLING: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: brew install age

      - run: npm ci

      - name: Assemble tvOS project through Expo and CocoaPods
        run: |
          mkdir -p "$RUNNER_TEMP/tomo-private/evidence"
          npx --no-install expo prebuild --clean --platform ios --no-install
          pod install --project-directory=ios
          for dir in ios/TomoTV.xcworkspace/xcshareddata/swiftpm ios/Pods/Pods.xcodeproj/project.xcworkspace/xcshareddata/swiftpm; do
            mkdir -p "$dir"
            cp packages/tomo-engine/Package.resolved "$dir/Package.resolved"
          done

      - name: Archive unsigned tvOS Release app
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace ios/TomoTV.xcworkspace -scheme TomoTV -configuration Release \
            -sdk appletvos -destination 'generic/platform=tvOS' -jobs 2 \
            -archivePath "$RUNNER_TEMP/tomo-private/TomoTV.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/tomo-derived-data" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/tomo-source-packages" \
            -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= DEVELOPMENT_TEAM= \
            2>&1 | tee "$RUNNER_TEMP/tomo-private/evidence/archive.log"

      - name: The app embeds the dynamic core and links it, not a static copy
        run: |
          app="$RUNNER_TEMP/tomo-private/TomoTV.xcarchive/Products/Applications/TomoTV.app"
          evidence="$RUNNER_TEMP/tomo-private/evidence"
          core="$app/Frameworks/SpatialAudioCore.framework/SpatialAudioCore"
          ls -la "$app/Frameworks" | tee "$evidence/frameworks.txt"
          file "$core" | tee "$evidence/core-file.txt"
          grep -q "dynamically linked shared library" "$evidence/core-file.txt"
          nm -gU "$core" | grep -c " _sab_" | tee "$evidence/core-exports.txt"
          find "$app" -type f -perm -u+x -exec sh -c 'file "$1" | grep -q Mach-O && echo "$1"' _ {} \; > "$evidence/machos.txt"
          linked=0
          while read -r binary; do
            [ "$binary" = "$core" ] && continue
            if nm -gU "$binary" 2>/dev/null | grep -q " _sab_"; then
              echo "static core symbols in $binary"
              exit 1
            fi
            if otool -L "$binary" | grep -q "@rpath/SpatialAudioCore.framework/SpatialAudioCore"; then
              echo "links the core: $binary"
              linked=1
            fi
          done < "$evidence/machos.txt"
          test "$linked" = 1
          test -s "$app/main.jsbundle"
          test -d "$app/PlugIns/TopShelf.appex"

      - name: Encrypt archive for the device check
        if: success()
        run: |
          mkdir -p "$RUNNER_TEMP/tomo-encrypted"
          COPYFILE_DISABLE=1 tar -czf "$RUNNER_TEMP/tomo-private.tar.gz" -C "$RUNNER_TEMP/tomo-private" evidence TomoTV.xcarchive
          artifact="tomo-tvos-${CANDIDATE_SHA:0:8}.tar.gz.age"
          age -r "$ARTIFACT_RECIPIENT" -o "$RUNNER_TEMP/tomo-encrypted/$artifact" "$RUNNER_TEMP/tomo-private.tar.gz"
          cd "$RUNNER_TEMP/tomo-encrypted"
          shasum -a 256 "$artifact" > SHA256SUMS

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: tomo-tvos-${{ env.CANDIDATE_SHA }}-private-encrypted
          path: ${{ runner.temp }}/tomo-encrypted/
          if-no-files-found: error
          retention-days: 30
