name: Spatial engine validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    if: github.repository == 'kristofferR/tomotv' && github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Checkout exact validation ref
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Toolchain and source
        run: |
          git rev-parse HEAD
          xcodebuild -version
          swift --version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install locked dependencies
        run: npm ci

      - name: Fetch pinned engine frameworks
        run: npm run fetch:ffmpeg

      - name: Install synthetic-fixture encoder
        run: brew install ffmpeg

      - name: Focused spatial regressions
        run: >-
          swift test --package-path packages/tomo-engine
          --filter 'SpatialAudioTests/(testDTSSyncPointsAcceptEveryCorePackingAndHDSubstreams|testInputEndingBeforeASpatialSessionStartsFallsBack|testAStagedSegmentFromBeforeResetCannotReplaceTheCurrentFile)'

      - name: Existing engine and native package suites
        run: npm run test:engine

      - name: Compile engine for Apple TV
        run: >-
          swift build --package-path packages/tomo-engine --target TomoEngine
          --scratch-path "$RUNNER_TEMP/tomo-tvos"
          --triple arm64-apple-tvos16.4 --sdk "$(xcrun --sdk appletvos --show-sdk-path)"

      - name: Compile engine for iOS
        run: >-
          swift build --package-path packages/tomo-engine --target TomoEngine
          --scratch-path "$RUNNER_TEMP/tomo-ios"
          --triple arm64-apple-ios16.4 --sdk "$(xcrun --sdk iphoneos --show-sdk-path)"

      - name: Record resolved dependency locks
        if: always()
        run: |
          cat packages/tomo-engine/Package.resolved
          cat native/ios/Package.resolved

      - name: Keep validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spatial-engine-logs
          path: |
            packages/tomo-engine/.build/test.log
            native/ios/.build/test.log
          if-no-files-found: ignore
